name: release

# Publishing a GitHub release publishes the package to npm.
# Authentication uses npm trusted publishing (OIDC) — there is no NPM_TOKEN secret.
on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for OIDC trusted publishing and for provenance attestation.
  # Publishing fails without it.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1, which is newer than the npm
      # bundled with the runner's Node.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly re-runs lint and build, but not the tests — so run them
      # here, before anything is published.
      - run: npm test

      - name: Check version and pick the npm dist-tag
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${TAG#v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json is $PKG_VERSION but the release is tagged $TAG." \
                 "Bump the version, or retag, so they agree."
            exit 1
          fi
          # Derive the dist-tag from the version itself, so a prerelease can never be published
          # as `latest` by mistake: 0.2.0-beta.0 -> beta, 0.2.0 -> latest.
          if echo "$PKG_VERSION" | grep -q -- '-'; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "Publishing $PKG_VERSION to the beta tag (latest is left untouched)"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "Publishing $PKG_VERSION to latest"
          fi

      # --provenance is explicit on purpose: it is documented as automatic under
      # OIDC but is not reliably applied without the flag.
      - run: npm publish --provenance --tag ${{ steps.release.outputs.dist_tag }}
